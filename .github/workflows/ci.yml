name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in src/*.js test/*.js; do node --check "$file"; done
      - name: Check FFmpeg availability in container
        run: docker build -t whatsapp-hd-repack-bot .
