<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0e10"><title>Sign in · Shelby+ Control Center</title>
<link rel="stylesheet" href="/dashboard/style.css"><link rel="manifest" href="/dashboard/manifest.webmanifest">
<link rel="apple-touch-icon" href="/dashboard/apple-touch-icon.png"><script defer src="/dashboard/app.js"></script>
</head>
<body class="login">
<main class="login-card panel">
  <div class="brand"><img src="/dashboard/icon.svg" alt="" width="38" height="38"><span>SHELBY<span class="accent">+</span></span></div>
  <h1>Control Center</h1>
  <p>Sign in to monitor your Shelby+ bot.</p>
  <form id="login" method="post" action="/api/admin/login">
    <label for="token">Administrator access token</label>
    <input id="token" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required maxlength="43">
    <button class="primary" type="submit">Sign in <span aria-hidden="true">→</span></button>
    <p id="login-error" role="status"></p>
  </form>
  <noscript>JavaScript is required to sign in.</noscript>
</main>
</body>
</html>
