name: Baileys experimental checks
on:
  push:
    branches:
      - feature/baileys-whatsapp-bot
  pull_request:
    branches:
      - feature/baileys-whatsapp-bot
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check syntax
        run: for file in src/*.js test/*.js; do node --check "$file" || exit; done
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run tests
        run: npm test
      - name: Build Docker image
        run: docker build -t whatsapp-hd-baileys:test .
      - name: Test media processing in the Docker image
        run: docker run --rm whatsapp-hd-baileys:test node --test test/baileys-media.test.js
