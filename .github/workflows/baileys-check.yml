name: Baileys experimental checks
on:
  push:
    branches:
      - feature/baileys-whatsapp-bot
  pull_request:
    branches:
      - feature/baileys-whatsapp-bot
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check syntax
        run: for file in src/*.js src/admin/*.js public/dashboard/*.js test/*.js scripts/*.js; do node --check "$file" || exit; done
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick libheif-plugin-libde265 redis-server
      - name: Run tests
        run: npm test
      - name: Build Docker image
        run: docker build -t whatsapp-hd-baileys:test .
      - name: Test media processing in the 512 MiB Docker image
        run: docker run --rm --memory=512m --memory-swap=512m whatsapp-hd-baileys:test node --test --test-concurrency=1 test/baileys-media.test.js test/shelby.test.js test/video-size.test.js test/ffmpeg-diagnostics.test.js test/video-progress.test.js test/turbo-engine.test.js
      - name: Benchmark video size control in the 512 MiB Docker image
        run: docker run --rm --cpus=1 --memory=512m --memory-swap=512m whatsapp-hd-baileys:test node scripts/benchmark-video-size.js
      - name: Benchmark Turbo candidates in the 512 MiB Docker image
        if: github.event_name == 'workflow_dispatch'
        run: docker run --rm --cpus=1 --memory=512m --memory-swap=512m whatsapp-hd-baileys:test node scripts/benchmark-turbo.js
      - name: Benchmark Control Center in the 512 MiB Docker image
        run: docker run --rm --cpus=1 --memory=512m --memory-swap=512m whatsapp-hd-baileys:test node scripts/benchmark-dashboard.js
      - name: Verify Control Center UI and capture fixture screenshots
        run: |
          npm install --prefix "$RUNNER_TEMP/shelby-ui" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/shelby-ui/node_modules/.bin/playwright" install --with-deps chromium webkit
          node scripts/check-dashboard-ui.js "$RUNNER_TEMP/shelby-ui/node_modules/playwright/index.mjs" "$RUNNER_TEMP/shelby-screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-center-fixtures
          path: ${{ runner.temp }}/shelby-screenshots
          if-no-files-found: ignore
