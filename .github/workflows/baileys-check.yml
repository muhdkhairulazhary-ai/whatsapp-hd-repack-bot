name: Baileys experimental checks
on:
  push:
    branches:
      - feature/baileys-whatsapp-bot
  pull_request:
    branches:
      - feature/baileys-whatsapp-bot
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check syntax
        run: for file in src/*.js test/*.js scripts/*.js; do node --check "$file" || exit; done
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick libheif-plugin-libde265 redis-server
      - name: Run tests
        run: npm test
      - name: Build Docker image
        run: docker build -t whatsapp-hd-baileys:test .
      - name: Test media processing in the 512 MiB Docker image
        run: docker run --rm --memory=512m --memory-swap=512m whatsapp-hd-baileys:test node --test --test-concurrency=1 test/baileys-media.test.js test/shelby.test.js test/video-size.test.js test/ffmpeg-diagnostics.test.js test/video-progress.test.js
      - name: Benchmark video size control in the 512 MiB Docker image
        run: docker run --rm --cpus=1 --memory=512m --memory-swap=512m whatsapp-hd-baileys:test node scripts/benchmark-video-size.js
